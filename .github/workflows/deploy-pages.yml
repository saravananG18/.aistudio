name: Deploy to GitHub Pages

"on":
  push:
    branches:
      - main
      - minimal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run lint
      - name: Validate Supabase configuration
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Set the Supabase URL and publishable key in this workflow." >&2
            exit 1
          fi
        env:
          VITE_SUPABASE_URL: "https://tkuevhfdfrjuexeuotjd.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_jL0l0lPKlR5bDeMjXihU3Q_jDXnih6z"
      - name: Build website
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://tkuevhfdfrjuexeuotjd.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_jL0l0lPKlR5bDeMjXihU3Q_jDXnih6z"
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
